[package]
name = "rawhid-host-tauri"
version = "1.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rawhid_host_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
rawhid-host-core = { path = "../rawhid-host-core" }
base64 = "0.22"
chrono = { workspace = true }
directories = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
# Feature unification enables this only for `cargo test`; the normal
# production dependency above remains featureless.
rawhid-host-core = { path = "../rawhid-host-core", features = ["test-support"] }
